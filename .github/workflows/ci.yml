name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # lmm with `lmm config paths` (not released yet): build this commit.
  LMM_REV: 217412614a50c590b0fa145cf47aa70e5518bced

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          cache: true
      - name: Install lmm (used by the end-to-end tests)
        run: |
          cargo install --locked --git https://github.com/szk302/local-markdown-mail --rev "${LMM_REV}" --root "${RUNNER_TEMP}/lmm" lmm
          echo "${RUNNER_TEMP}/lmm/bin" >> "$GITHUB_PATH"
      - name: Show the tools
        run: |
          lmm --version
          lmm config paths --help >/dev/null
          python3 --version
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
